		        <h1>组图：向军人致敬 纽约老兵节盛大游行登场</h1>
<div>2026年11月11日星期三，数千人参加了在纽约曼哈顿第五大道举行的退伍军人节游行。（戴兵／大纪元）</div><hr><p>【大纪元2026年11月12日讯】（大纪元记者戴兵纽约报导）周三（11月11日），第107届纽约退伍军人节（老兵节）游行（New York City Veterans Day Parade）在纽约曼哈顿第五大道登场。这是全美规模最大的老兵节游行，汇聚数千名退伍军人、军人家属及社区团体，共同向为美国服役的军人致敬。</p><div><figure style="max-width:640px"><picture><source srcSet="/mirror/i.epochtimes.com/assets/uploads/2026/11/id14887448-LD208110.jpg" type="image/webp"/><source srcSet="/mirror/i.epochtimes.com/assets/uploads/2026/11/id14887448-LD208110.jpg" type="image/jpeg"/><img src="/mirror/i.epochtimes.com/assets/uploads/2026/11/id14887448-LD208110.jpg" alt="2026年11月11日，数千人参加了在纽约曼哈顿第五大道举行的退伍军人节游行。（戴兵／大纪元）" width="640" height="auto"/></picture><figcaption>2026年11月11日，数千人参加了在纽约曼哈顿第五大道举行的退伍军人节游行。（戴兵／大纪元）</figcaption></figure></div><div><figure style="max-width:640px"><picture><source srcSet="/mirror/i.epochtimes.com/assets/uploads/2026/11/id14887449-LD208163.jpg" type="image/webp"/><source srcSet="/mirror/i.epochtimes.com/assets/uploads/2026/11/id14887449-LD208163.jpg" type="image/jpeg"/><img src="/mirror/i.epochtimes.com/assets/uploads/2026/11/id14887449-LD208163.jpg" alt="2026年11月11日，数千人参加了在纽约曼哈顿第五大道举行的退伍军人节游行。（戴兵／大纪元）" width="640" height="auto"/></picture><figcaption>2026年11月11日，数千人参加了在纽约曼哈顿第五大道举行的退伍军人节游行。（戴兵／大纪元）</figcaption></figure></div><div><figure style="max-width:640px"><picture><source srcSet="/mirror/i.epochtimes.com/assets/uploads/2026/11/id14887450-LD208262.jpg" type="image/webp"/><source srcSet="/mirror/i.epochtimes.com/assets/uploads/2026/11/id14887450-LD208262.jpg" type="image/jpeg"/><img src="/mirror/i.epochtimes.com/assets/uploads/2026/11/id14887450-LD208262.jpg" alt="2026年11月11日，数千人参加了在纽约曼哈顿第五大道举行的退伍军人节游行。纽约市长马姆达尼参加游行。（戴兵／大纪元）" width="640" height="auto"/></picture><figcaption>2026年11月11日，数千人参加了在纽约曼哈顿第五大道举行的退伍军人节游行。纽约市长马姆达尼参加游行。（戴兵／大纪元）</figcaption></figure></div><div><figure style="max-width:640px"><picture><source srcSet="/mirror/i.epochtimes.com/assets/uploads/2026/11/id14887451-LD208351.jpg" type="image/webp"/><source srcSet="/mirro
