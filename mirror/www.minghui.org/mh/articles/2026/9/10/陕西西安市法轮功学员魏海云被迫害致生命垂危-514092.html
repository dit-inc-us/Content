		        <h1>陕西西安市法轮功学员魏海云被迫害致生命垂危</h1>
<p><img src="/mirror/www.minghui.org/mh/article_images/2004-6-6-force_feeding.jpg" border="1" width="300" hspace="5" vspace="5" alt="酷刑演示：野蛮灌食（绘画）"><br>酷刑演示：野蛮灌食（绘画）</p>
<p>抢救期间，魏海云有几次清醒过来，说警察给她灌食后又昏迷了过去。前几天因她呼吸不畅，不得已把喉管切开，医生发现她的肺部已经严重发炎。</p>
<p>她亲人说她一只脚后跟有一个洞，骨头都翻出来。魏海云具体在里面遭了什么，待查。</p>
<p>西安市莲湖区土门派出所<br>地址：莲湖区沣镐二坊6号院<br>联系电话：029-84265537 / 029-84230802</p>
